services:
  postgres:
    image: postgres:17.4-alpine
    ports:
      - '5432:5432'
    volumes:
      # Named volume instead of a bind mount: Postgres data dirs on NTFS bind
      # mounts fail permission checks under Docker Desktop on Windows.
      - pg-data:/var/lib/postgresql/data
    env_file: .env
  ui:
    build: ./app
    ports:
      - '3000:3000'
    volumes:
      - ./app:/app
      - /app/node_modules
    env_file: .env
  api:
    build: ./api
    # --legacy-watch polls for changes: inotify events don't cross Windows
    # bind mounts, so plain nodemon never sees host-side edits.
    command: nodemon --legacy-watch ./src
    ports:
      - '3003:3003'
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file: .env
  adhoc:
    build: ./adhoc
    volumes:
      - ./adhoc:/app
      - /app/node_modules
    env_file: .env

volumes:
  pg-data:
